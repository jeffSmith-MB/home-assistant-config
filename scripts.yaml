play_gym_playlist:
  sequence:
    - action: media_player.turn_on
      target:
        entity_id: media_player.gym_2

    - delay: "00:00:01"

    - action: music_assistant.play_media
      target:
        entity_id: media_player.gym_2
      data:
        media_id: "{{ playlist }}"
        media_type: playlist
          
gym_appletv_crave:
  alias: "Select Crave"
  sequence:
    - action: remote.send_command
      target:
        entity_id: remote.gym_remote
      data:
        delay_secs: 1.5
        command:
          - top_menu
          - home
          - right
          - select

gym_appletv_peloton:
  alias: "Select Peloton"
  sequence:
    - action: remote.send_command
      target:
        entity_id: remote.gym_remote
      data:
        delay_secs: 1.5
        command:
          - top_menu
          - home
          - right
          - right
          - right
          - select
